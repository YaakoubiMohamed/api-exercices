<div class="selector-container">
  <label for="competition">🏆 Sélectionner une compétition:</label>
  <select 
    id="competition" 
    (change)="onSelectionChange($event)"
    class="competition-select">
    @for (comp of competitions; track comp.code) {
      <option [value]="comp.code">
        {{ comp.flag }} {{ comp.name }}
      </option>
    }
  </select>
</div>
