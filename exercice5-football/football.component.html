<div class="football-container">
  <!-- Header -->
  <header class="header">
    <a routerLink="/" class="back-link">← Retour</a>
    <h1>⚽ Football Data</h1>
    <p class="subtitle">Exercice 5 - Consommation d'API (Démonstration)</p>
  </header>
  
  <!-- Competition Selector -->
  <app-competition-selector 
    (selectionChange)="onCompetitionChange($event)" />
  
  <!-- Loading State -->
  @if (loading) {
    <div class="loading">
      <div class="spinner"></div>
      <p>Chargement des données...</p>
    </div>
  }
  
  <!-- Error State -->
  @if (error) {
    <div class="error">
      <p>❌ {{ error }}</p>
      <button (click)="retry()">Réessayer</button>
    </div>
  }
  
  <!-- Data Display -->
  @if (!loading && !error) {
    <div class="data-grid">
      <app-standings-table [standings]="standings" />
      <app-top-scorers [scorers]="scorers" />
    </div>
  }
  
  <!-- Explanation Links -->
  <div class="explanation-link">
    <a routerLink="/exercice5/explanation">📚 Explication Détaillée</a>
    <a routerLink="/exercice5/explanation-visual" class="visual-link">🎨 Explication Visuelle Animée</a>
  </div>
</div>
